name: Daily crawl & deploy
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  crawl-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crawl (scheduled runs only)
        if: github.event_name != 'push'
        run: node scripts/crawl.js
      - name: Bot discovery scan (scheduled runs only)
        if: github.event_name != 'push'
        run: node scripts/discover-bots.js
        continue-on-error: true
      - name: Commit snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "canicrawl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git push
      - name: Build site
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: node scripts/build.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Notify search indexes (IndexNow)
        run: node scripts/indexnow.js
        continue-on-error: true
